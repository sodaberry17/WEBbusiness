<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Image Grid</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 2in);
            grid-template-rows: repeat(3, 2in);
            gap: 10px;
        }
        .container img {
            width: 2in;
            height: 2in;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://i.pinimg.com/736x/6b/8b/0f/6b8b0fa1661309697ed9de3f1c548148.jpg" alt="Image 1">
        <img src="https://i.pinimg.com/736x/fe/85/91/fe8591232ef2527138a0f03f52454b17.jpg" alt="Image 2">
        <img src="https://i.pinimg.com/736x/07/d6/26/07d62614e88513bb0c6885db1641f24d.jpg" alt="Image 3">
        <img src="https://i.pinimg.com/736x/fb/ce/10/fbce10cb530566995feb853a72e0b4f7.jpg" alt="Image 4">
        <img src="https://i.pinimg.com/736x/9d/aa/6f/9daa6fab2b835122e8e3afe6d265b5af.jpg" alt="Image 5">
        <img src="https://i.pinimg.com/736x/7a/65/ab/7a65abf9784efce3864a6286a97787f4.jpg" alt="Image 6">
        <img src="https://i.pinimg.com/736x/7f/56/f2/7f56f224b66775fa9850087fde8d68fe.jpg" alt="Image 7">
        <img src="https://i.pinimg.com/736x/2b/4a/16/2b4a160099044d72b9290213f1370bb4.jpg" alt="Image 8">
        <img src="https://i.pinimg.com/564x/6d/85/50/6d85507c5ff7586cd54fe04e243923b3.jpg" alt="Image 9">
    </div>
    </div>
</body>
</html>
